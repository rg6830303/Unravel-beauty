}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

#unravel-glass .u-shade{position:absolute;inset:0;z-index:-3;background:linear-gradient(180deg,transparent 28%,#0b110a0d 40%,#08110885 80%,#0811088c)}
#unravel-glass .u-atmosphere{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:-2}
#unravel-glass .u-fog{position:absolute;width:170%;height:170px;left:-40%;top:44%;border-radius:50%;opacity:var(--u-mist);background:radial-gradient(ellipse at 24% 50%,#e7eed44a,transparent 58%),radial-gradient(ellipse at 68% 60%,#e3edce52,transparent 58%);filter:blur(20px);animation:u-mist-drift 28s ease-in-out infinite alternate;will-change:transform}
#unravel-glass .u-fog.u-fog-low{top:auto;bottom:3%;height:150px;animation-duration:36s;animation-delay:-18s;opacity:calc(var(--u-mist)*.7)}
#unravel-glass .u-floating-leaf{position:absolute;top:-45px;left:var(--x);width:var(--size);height:calc(var(--size)*.48);border-radius:90% 0 90% 0;background:linear-gradient(25deg,#5c602b,#c5c271 60%,#7c853b);box-shadow:inset 0 1px #f0e7b859;opacity:0;animation:u-leaf-fall var(--speed) linear infinite;animation-delay:var(--delay)}
#unravel-glass .u-floating-leaf::after{content:&quot;&quot;;position:absolute;left:10%;top:47%;height:1px;width:75%;background:#d0ca8c7a;transform:rotate(-24deg)}
#unravel-glass .u-light-dust{position:absolute;width:3px;height:3px;background:#fff2ad;border-radius:50%;left:22%;top:41%;opacity:.4;box-shadow:135px -54px 2px #fff3b899,58px 45px 1px #fff3b888,212px 170px 2px #fff3b866,120px 195px 1px #fff3b888;animation:u-dust 15s ease-in-out infinite alternate}
@keyframes u-mist-drift{from{transform:translate3d(-7%,8px,0) scale(.97)}to{transform:translate3d(13%,-16px,0) scale(1.09)}}
@keyframes u-leaf-fall{0%{transform:translate3d(-20px,0,0) rotate(15deg) rotateY(0);opacity:0}12%{opacity:.68}45%{transform:translate3d(43px,345px,0) rotate(105deg) rotateY(135deg)}82%{opacity:.48}100%{transform:translate3d(-18px,810px,0) rotate(235deg) rotateY(310deg);opacity:0}}
@keyframes u-dust{from{transform:translate3d(0,12px,0);opacity:.3}to{transform:translate3d(18px,-24px,0);opacity:.65}}
#unravel-glass .u-top{position:absolute;z-index:5;top:10px;left:14px;right:14px;display:flex;align-items:center;justify-content:space-between;height:84px;pointer-events:none;background:none;border:0;box-shadow:none}
#unravel-glass .u-top&gt;*{pointer-events:auto}#unravel-glass .u-logo-link{display:block;width:82px;height:82px;border:0;padding:0;background:none}#unravel-glass .u-logo{display:block;width:82px;height:82px;object-fit:contain}
#unravel-glass .u-icon{border:0;background:none;width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;position:relative;padding:0;flex-shrink:0}#unravel-glass .u-icon svg{width:21px;height:21px;stroke-width:1.5;filter:drop-shadow(0 1px 4px #0008)}
#unravel-glass .u-count{position:absolute;right:2px;top:0;font-size:10px;line-height:16px;text-align:center;min-width:16px;border-radius:50%;background:#eee6c9;color:#1d281a}
#unravel-glass .u-scroll{height:100%;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;scroll-behavior:smooth}#unravel-glass .u-scroll::-webkit-scrollbar{display:none}
#unravel-glass .u-hero{min-height:732px;display:flex;flex-direction:column;justify-content:flex-end;padding:180px 27px 44px}
#unravel-glass .u-eyebrow{font-size:10px;line-height:1.5;letter-spacing:2.3px;margin:0 0 17px;color:#f3f1dc}
#unravel-glass h1{font-family:Georgia,&#x27;Times New Roman&#x27;,serif;font-size:44px;line-height:1.03;letter-spacing:-1.6px;font-weight:400;margin:0 0 17px;text-shadow:0 2px 24px #0009}
#unravel-glass h1 em{font-weight:400;color:#eaeccf}#unravel-glass p{font-size:14px;line-height:1.6;margin:0 0 23px;color:#f0efdf}#unravel-glass .u-hero p{max-width:255px;text-shadow:0 1px 6px #0009}
#unravel-glass .u-cta{border:1px solid #fff9;border-radius:28px;background:linear-gradient(120deg,#f7f3e5e8,#e7e7cddb);color:#25311f;min-height:49px;padding:0 19px;display:flex;align-items:center;justify-content:space-between;width:100%;font-size:13px;gap:10px;box-shadow:0 4px 18px #0002,inset 0 1px #fff8;transition:transform .24s,box-shadow .24s;text-align:left}
#unravel-glass .u-cta svg{width:19px;height:19px}#unravel-glass .u-cta:active{transform:scale(.98)}
#unravel-glass .u-cue-row{display:flex;justify-content:space-between;align-items:center;margin-top:20px}#unravel-glass .u-cue{display:flex;gap:7px;align-items:center;font-size:11px;color:#e5e9d5}#unravel-glass .u-cue svg{width:15px;height:15px}#unravel-glass .u-motion-toggle{opacity:.85}
#unravel-glass .u-section{padding:0 18px 92px}#unravel-glass .u-glass{background:linear-gradient(132deg,#fff5e328,#fffde308 53%,#fff9e21c),rgb(26 32 23 / var(--u-glass-alpha));backdrop-filter:blur(var(--u-blur)) saturate(1.32);-webkit-backdrop-filter:blur(var(--u-blur)) saturate(1.32);border:1px solid #f8f4d847;border-radius:var(--u-radius);box-shadow:inset 0 1px 0 #fff7,inset 0 -1px 0 #ffffff13,0 18px 45px #09100827}
